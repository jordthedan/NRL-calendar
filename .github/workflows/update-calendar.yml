name: Update NRL calendar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_calendar.py'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: nrl-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate calendar
        run: python scripts/update_calendar.py

      - name: Commit changed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nrl-calendar.ics
          if git diff --cached --quiet; then
            echo "No fixture changes."
          else
            git commit -m "Update NRL calendar"
            git push
          fi
